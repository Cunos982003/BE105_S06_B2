  name: User Service CI

  on:
    push:
      branches:
        - main
  jobs:
    build_job:
      runs-on: [___]
      steps:
        - name: Checkout code
          uses: [___]

        - name: Setup Java JDK 17
          uses: actions/setup-java@v4
          with:
            java-version: '17'
            distribution: 'temurin'

        - name: Build Jar
          run: |
            chmod +x ./gradlew
            ./gradlew bootJar

        - name: Upload Artifact
          uses: actions/upload-artifact@v4
          with:
            name: user-service-artifact
            path: [___]
            retention-days: 3